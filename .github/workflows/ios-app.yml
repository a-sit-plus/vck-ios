name: iOS App

# Builds vck's Swift package from source, and tests the demo app against it, as the Xcode project references
# ../../vck as a local package.
on:
  push:
  workflow_dispatch:
    inputs:
      vck-ref:
        description: "Branch, tag or commit of a-sit-plus/vck to test against"
        required: false
        type: string

env:
  VCK_REF: ${{ inputs.vck-ref || 'feature/swift-package' }}

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v5
        with:
          path: vck-ios

      - name: Checkout VC-K
        uses: actions/checkout@v5
        with:
          repository: a-sit-plus/vck
          ref: ${{ env.VCK_REF }}
          path: vck

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: vck/**/*.gradle.kts

      - name: Build debug XCFramework, which vck's Package.swift picks up
        working-directory: vck
        run: ./gradlew --no-daemon :vck-ios:assembleVckIosDebugXCFramework

      - name: Test the app
        working-directory: vck-ios/vckiostest
        run: |
          set -euo pipefail
          simulator="$(xcrun simctl list devices available iPhone -j \
            | python3 -c 'import json,sys; print(next(d["udid"] for r in json.load(sys.stdin)["devices"].values() for d in r))')"
          xcodebuild test -project vckiostest.xcodeproj -scheme vckiostest \
            -destination "id=$simulator" -only-testing:vckiostestTests
